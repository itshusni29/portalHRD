{% extends 'layouts/d_base.html' %}

{% block title %} Tambah Prosedur {% endblock title %}

{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

    <!-- Header -->
    <div class="header">
      <div class="container-fluid">
        <div class="header-body">
          <div class="row align-items-center py-4">
            <div class="col-lg-6 col-7">
              <nav aria-label="breadcrumb" class="d-none d-md-inline-block ml-md-4">
                <ol class="breadcrumb breadcrumb-links breadcrumb-dark">
                  <li class="breadcrumb-item"><a href="#"><i class="fas fa-home"></i></a></li>
                  <li class="breadcrumb-item"><a href="#">Prosedur</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Tambah</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Page content -->
    <div class="container-fluid">
      <div class="row">
        <div class="col-xl-12">
          <div class="card">
            <div class="card-header border-0">
              <div class="row align-items-center">
                <div class="col">
                  <h3 class="mb-0">Daftar Prosedur</h3>
                </div>
                
              </div>
            </div>
            <div class="card-body">
              <!-- Form Start -->
              <form method="post">
                {% csrf_token %}

                <div class="form-group">
                  <label for="nama">Nama:</label>
                  <input type="text" class="form-control" id="nama" name="nama" required>
                </div>
                
                <div class="form-group">
                    <label for="prod_preparation_aluminium">PROD PREPARATION ALUMINIUM:</label>
                    <input type="number" step="0.1" class="form-control" id="prod_preparation_aluminium" name="prod_preparation_aluminium">
                </div>
                
                <div class="form-group">
                    <label for="prod_preparation_steel">PROD PREPARATION STEEL:</label>
                    <input type="number" step="0.1" class="form-control" id="prod_preparation_steel" name="prod_preparation_steel">
                </div>
                
                <div class="form-group">
                    <label for="head_cylinder_piston_production_ged3">HEAD CYLINDER & PISTON PRODUCTION - GED #3:</label>
                    <input type="number" step="0.1" class="form-control" id="head_cylinder_piston_production_ged3" name="head_cylinder_piston_production_ged3">
                </div>
                
                <div class="form-group">
                    <label for="gear_axle_production_ged4">GEAR AXLE PRODUCTION - GED #4:</label>
                    <input type="number" step="0.1" class="form-control" id="gear_axle_production_ged4" name="gear_axle_production_ged4">
                </div>
                
                <div class="form-group">
                    <label for="crank_shaft_production_ged5">CRANK SHAFT PRODUCTION - GED #5:</label>
                    <input type="number" step="0.1" class="form-control" id="crank_shaft_production_ged5" name="crank_shaft_production_ged5">
                </div>
                
                <div class="form-group">
                    <label for="quality_assurance">Quality Assurance:</label>
                    <input type="number" step="0.1" class="form-control" id="quality_assurance" name="quality_assurance">
                </div>
                
                <div class="form-group">
                    <label for="finance">Finance:</label>
                    <input type="number" step="0.1" class="form-control" id="finance" name="finance">
                </div>
                
                <div class="form-group">
                    <label for="die_casting_wheel_gedung2">Die Casting Wheel - Gedung #2:</label>
                    <input type="number" step="0.1" class="form-control" id="die_casting_wheel_gedung2" name="die_casting_wheel_gedung2">
                </div>
                
                <div class="form-group">
                    <label for="tools_center">Tools Center:</label>
                    <input type="number" step="0.1" class="form-control" id="tools_center" name="tools_center">
                </div>
                
                <div class="form-group">
                  <label for="plant_2_production">Plant-2 Production:</label>
                  <input type="number" step="0.1" class="form-control" id="plant_2_production" name="plant_2_production">
                </div>
                
                <div class="form-group">
                    <label for="production_engineering_aluminium_1">Production Engineering Aluminium #1:</label>
                    <input type="number" step="0.1" class="form-control" id="production_engineering_aluminium_1" name="production_engineering_aluminium_1">
                </div>
                
                <div class="form-group">
                    <label for="machining_painting_wheel_gedung1">Machining & Painting Wheel - Gedung #1:</label>
                    <input type="number" step="0.1" class="form-control" id="machining_painting_wheel_gedung1" name="machining_painting_wheel_gedung1">
                </div>
                
                <div class="form-group">
                    <label for="purchasing">Purchasing:</label>
                    <input type="number" step="0.1" class="form-control" id="purchasing" name="purchasing">
                </div>
                
                <div class="form-group">
                    <label for="mtc_operation">MTC Operation:</label>
                    <input type="number" step="0.1" class="form-control" id="mtc_operation" name="mtc_operation">
                </div>
                
                <div class="form-group">
                    <label for="quality_engineering">Quality Engineering:</label>
                    <input type="number" step="0.1" class="form-control" id="quality_engineering" name="quality_engineering">
                </div>
                
                <div class="form-group">
                    <label for="quality_control">Quality Control:</label>
                    <input type="number" step="0.1" class="form-control" id="quality_control" name="quality_control">
                </div>
                
                <div class="form-group">
                    <label for="hrd">HRD:</label>
                    <input type="number" step="0.1" class="form-control" id="hrd" name="hrd">
                </div>
                
                <div class="form-group">
                    <label for="general_affairs">General Affairs:</label>
                    <input type="number" step="0.1" class="form-control" id="general_affairs" name="general_affairs">
                </div>
                
                <div class="form-group">
                    <label for="gravity_die_casting_wheel_gd6">Gravity & Die Casting Wheel - GD #6:</label>
                    <input type="number" step="0.1" class="form-control" id="gravity_die_casting_wheel_gd6" name="gravity_die_casting_wheel_gd6">
                </div>
              
                <div class="form-group">
                  <label for="quality_safety_environment_qse">Quality, Safety & Environment (QSE):</label>
                  <input type="number" step="0.1" class="form-control" id="quality_safety_environment_qse" name="quality_safety_environment_qse">
                </div>
                
                <div class="form-group">
                    <label for="production_engineering_aluminium_2">Production Engineering Aluminium #2:</label>
                    <input type="number" step="0.1" class="form-control" id="production_engineering_aluminium_2" name="production_engineering_aluminium_2">
                </div>
                
                <div class="form-group">
                    <label for="mtc_engineering">MTC Engineering:</label>
                    <input type="number" step="0.1" class="form-control" id="mtc_engineering" name="mtc_engineering">
                </div>
                
                <div class="form-group">
                    <label for="value_innovation">Value Innovation:</label>
                    <input type="number" step="0.1" class="form-control" id="value_innovation" name="value_innovation">
                </div>
                
                <div class="form-group">
                    <label for="production_engineering_steel_2">Production Engineering Steel #2:</label>
                    <input type="number" step="0.1" class="form-control" id="production_engineering_steel_2" name="production_engineering_steel_2">
                </div>
                
                <div class="form-group">
                    <label for="production_common">Production Common:</label>
                    <input type="number" step="0.1" class="form-control" id="production_common" name="production_common">
                </div>
                
                <div class="form-group">
                    <label for="production_planning">Production Planning:</label>
                    <input type="number" step="0.1" class="form-control" id="production_planning" name="production_planning">
                </div>
                
                <div class="form-group">
                    <label for="inventory_control">Inventory Control:</label>
                    <input type="number" step="0.1" class="form-control" id="inventory_control" name="inventory_control">
                </div>
                
                <div class="form-group">
                    <label for="production_delivery_control">Production & Delivery Control:</label>
                    <input type="number" step="0.1" class="form-control" id="production_delivery_control" name="production_delivery_control">
                </div>
                
                <div class="form-group">
                    <label for="production_engineering_steel_1">Production Engineering Steel #1:</label>
                    <input type="number" step="0.1" class="form-control" id="production_engineering_steel_1" name="production_engineering_steel_1">
                </div>
              

                
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
              <!-- Form End -->
            </div>
          </div>
        </div>
      </div>

      {% include "includes/footer.html" %}

    </div>

{% endblock content %}
